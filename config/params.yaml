# ============================================================
#  trash_robot_sim — параметры узлов
#  Загружаются через gazebo.launch.py и передаются нодам.
# ============================================================

# ── Навигатор (astar_navigator) ──────────────────────────────
astar_navigator:
  ros__parameters:

    # Расстояние между строками зигзага (boustrophedon), метры.
    # Должно быть ≈ ширине обзора камеры, чтобы не пропустить объекты.
    # Примечание: inflation в коде = 1.1м (полудиагональ тела 0.72м + запас 0.38м).
    row_spacing: 2.5

    # Отступ от краёв области сканирования, метры.
    # Предотвращает столкновение со стенами при навигации по краям.
    area_margin: 0.8

    # Максимальные скорости робота
    max_linear_velocity: 0.65   # м/с
    max_angular_velocity: 0.9   # рад/с

    # Радиус, в котором цель считается достигнутой, метры.
    goal_radius: 0.90

    # Таймаут на достижение одной точки покрытия, секунды.
    # По истечении — точка пропускается.
    goal_timeout: 120.0

    # Параметры Pure Pursuit
    lookahead: 1.5        # дальность точки упреждения, метры
    waypoint_radius: 0.50 # радиус принятия промежуточной точки пути, метры

    # Мировые координаты центра тела робота при спавне.
    # Нужны для коррекции odom-смещения (DiffDrive стартует с odom=(0,0)).
    # Тело = model_pose + body_offset: (-0.5 + 0.5, -2.0) = (0.0, -2.0)
    spawn_x: 0.0
    spawn_y: -2.0


# ── Построитель карты (map_builder) ──────────────────────────
map_builder:
  ros__parameters:

    # Минимальная валидная дальность лидара, метры.
    # Корпус робота 1.2×0.8м: полудиагональ = 0.72м.
    # 0.85м > 0.72м — надёжно отсекает саморефлексию от углов корпуса.
    lidar_min_valid: 0.85

    # Мировые координаты центра тела робота при спавне (для коррекции odom-смещения).
    spawn_x: 0.0
    spawn_y: -2.0


# ── YOLOv8-детектор мусора (trash_detector) ──────────────────
trash_detector:
  ros__parameters:

    # Пустая строка = detector.py возьмёт share/models/yolov8n_trash.pt.
    # Можно указать абсолютный путь к свежему best.pt после обучения.
    model_path: ""

    # YOLO confidence threshold. Для финальной модели подбирать на valid/sim.
    conf_thresh: 0.35

    # Радиус объединения повторных 3D-детекций одного предмета, метры.
    merge_dist: 1.2

    # Частота инференса. Для yolov8n на CPU можно снизить до 1-2 Гц.
    detect_rate: 4.0

    # JSONL-лог для оценки demo run: bbox, confidence, depth, world x/y, latency.
    log_path: "/tmp/trash_detections.jsonl"

    # Сохранять полный кадр и crop новых объектов в /tmp/trash_detected.
    save_crops: true

    # Фильтр валидной глубины RGBD-камеры.
    min_depth: 0.10
    max_depth: 10.0

    # Опционально: "cigarette_butt:0.2,plastic_bottle:0.45".
    # Работает поверх глобального conf_thresh.
    class_conf_overrides: ""

    # rgbd: RGB и depth берутся из одной RGBD-камеры.
    # nav_ground_plane: RGB с NavCamera, локализация через плоскость пола.
    camera_mode: "rgbd"
    rgb_topic: "/rgbd/image/image"
    depth_topic: "/rgbd/image/depth_image"
    camera_info_topic: "/rgbd/image/camera_info"

    # Мировые координаты центра тела робота при спавне.
    spawn_x: 0.0
    spawn_y: -2.0
